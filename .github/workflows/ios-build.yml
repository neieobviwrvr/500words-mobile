name: iOS unsigned build (for Sideloadly)

# Manuell auslösen (Actions-Tab -> "Run workflow"), damit nicht bei jedem Push
# unnötig ein ~15-20 Min. macOS-Build verbraucht wird.
#
# Umgezogen (2026-09-10): der Git-Root wurde von "mobile/" auf den
# uebergeordneten "500 words"-Ordner hochgezogen (Commit "Git-Root eine
# Ebene hochgezogen, Projektdoku gesichert"). GitHub Actions sucht Workflows
# ausschliesslich unter ".github/workflows/" am ECHTEN Repo-Root - die Datei
# lag danach unerreichbar unter "mobile/.github/workflows/" und wurde von
# `gh workflow list` nicht mehr gefunden. Diese Kopie liegt jetzt am
# richtigen Ort; alle working-directory-Pfade tragen deshalb ein "mobile/"-
# Praefix, das es vorher nicht brauchte.
on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    # Expo-Module aus QUELLCODE bauen statt vorkompilierte Binaries zu ziehen
    # (2026-09-10, nach dem zweiten Anlauf am selben Absturz).
    #
    # Expo SDK 54+ laedt fuer einen Teil der Module fertige XCFrameworks
    # herunter, statt sie zu kompilieren - im Log als "[Expo-precompiled]
    # Precompiled modules: ExpoFileSystem, ExpoFont, ExpoModulesCore,
    # ExpoModulesWorklets" zu sehen. Genau daran lag der Absturz: das
    # heruntergeladene ExpoFont 57.0.2 verlangt vier Methoden von
    # BaseModule/AnyModule (didCreate, willDestroy, didStartListening,
    # didStopListening), die es in ExpoModulesCore 57.0.8 nicht mehr gibt.
    # Zwei Binaries aus verschiedenen Bauzustaenden, dyld bricht beim Start
    # ab - noch vor der ersten Zeile JS.
    #
    # Der Fehler steckt im npm-PAKET, nicht im Build: die fertigen
    # Frameworks liegen als Tarballs unter
    # node_modules/<paket>/prebuilds/output/<debug|release>/xcframeworks/.
    # Beide Varianten, debug wie release, sind gleich kaputt, und
    # expo-font 57.0.3 bringt binaergleich dasselbe mit - ein
    # Versionswechsel hilft also nicht. Nachpruefbar ohne CI: Tarball
    # entpacken und die Symboltabellen gegeneinanderhalten.
    #
    # Der erste Erklaerungsversuch (veralteter CI-Cache, Commit
    # "CI: Cache-Schluessel haerten") war falsch: der Build danach lief mit
    # LEEREN Caches - beide Schluessel meldeten "Cache not found" - und
    # lieferte trotzdem byte-identisch dasselbe kaputte ExpoFont. Ein
    # Cache-Miss laedt die kaputten Frameworks nur neu herunter, statt sie
    # wiederzuverwenden. Aus Quellcode gebaut stammen dagegen alle Module
    # zwangslaeufig aus demselben Stand.
    #
    # Warum die Variable ueberhaupt noetig ist, obwohl sie hier nie gesetzt
    # war: der von `expo prebuild` erzeugte Podfile schaltet das Verfahren
    # selbst ein (`ENV['EXPO_USE_PRECOMPILED_MODULES'] ||= '1'`, aus
    # expo-template-bare-minimum). Weil das ein `||=` ist und '0' in Ruby
    # wahr ist, gewinnt ein hier gesetzter Wert - ein blosses Weglassen
    # wuerde dagegen wieder auf '1' fallen.
    #
    # Preis: der Build dauert laenger. Bei einem manuell ausgeloesten
    # Workflow ist das die richtige Abwaegung.
    env:
      EXPO_USE_PRECOMPILED_MODULES: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install JS-Abhaengigkeiten
        run: npm ci

      - name: Native iOS-Projekt generieren (Continuous Native Generation)
        run: npx expo prebuild --platform ios --no-install

      # Cache-Key haengt an Podfile UND package-lock.json (2026-09-10,
      # korrigiert nach einem echten Absturzfund - siehe unten).
      # frueher nur am Podfile: das listet Paketpfade, keine Versionen, also
      # blieb der Hash oft identisch, obwohl sich eine npm-Abhaengigkeit
      # geaendert hatte. Ein Build vom 2026-09-07 blieb dadurch bis zum
      # 2026-09-10 im Cache und wurde bei JEDEM Build seitdem stillschweigend
      # wiederverwendet - trotz drei zwischenzeitlicher Commits. Ergebnis:
      # ExpoFont.framework und ExpoModulesCore.framework aus zwei
      # verschiedenen Bauzustaenden im selben .app-Bundle, die App stuerzte
      # noch vor der ersten Zeile JS ab ("Symbol not found", dyld-Fehler,
      # kein React-Native-Bug). KEINE restore-keys mehr: ein Praefix-Treffer
      # haette denselben Fehler reproduziert, nur mit anderem Wortlaut - bei
      # einem manuell ausgeloesten, selten laufenden Workflow ist ein
      # sauberer Cache-Miss (paar Minuten laenger) die richtige Abwaegung
      # gegenueber einem schnellen, aber kaputten Build.
      - name: CocoaPods cachen
        uses: actions/cache@v4
        with:
          path: |
            mobile/ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('mobile/package-lock.json', 'mobile/ios/Podfile') }}

      - name: CocoaPods installieren
        working-directory: mobile/ios
        run: pod install

      # Xcode-DerivedData cachen, damit xcodebuild inkrementell kompiliert
      # statt jedes Mal Hermes/React-Native-Core/alle nativen Module von
      # null neu zu bauen. Derselbe Schluessel-Fix wie beim CocoaPods-Cache
      # oben, aus demselben Fund: "rein additiv, schlimmstenfalls kein
      # Speedup" stimmte nicht - ein veralteter DerivedData-Stand kann
      # Frameworks gegen einen inzwischen anderen ExpoModulesCore linken und
      # die App schon vor dem ersten JS-Aufruf abstuerzen lassen. Deshalb
      # ebenfalls package-lock.json im Schluessel und keine restore-keys.
      - name: Xcode DerivedData cachen
        uses: actions/cache@v4
        with:
          path: mobile/ios/build
          key: ${{ runner.os }}-xcode-derived-${{ hashFiles('mobile/package-lock.json', 'mobile/ios/Podfile') }}

      # Bewusst UNSIGNED gebaut - es werden keine Apple-Zertifikate/Secrets in
      # der CI gebraucht. Sideloadly signiert die .app anschliessend lokal mit
      # einer kostenlosen Apple-ID neu und installiert sie aufs iPhone.
      - name: Unsigned Device-Build
        working-directory: mobile/ios
        run: |
          xcodebuild \
            -workspace mobile.xcworkspace \
            -scheme mobile \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Als .ipa verpacken
        working-directory: mobile/ios
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/mobile.app"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r mobile-unsigned.ipa Payload

      # Prueft das FERTIGE Bundle, nicht den Bauvorgang (2026-09-10).
      # Der Absturz oben kam durch einen gruenen Build: xcodebuild meldet
      # nichts, wenn ein Framework ein Symbol anfordert, das ein anderes
      # nicht mehr liefert - das faellt erst dyld auf dem Geraet auf. Dieser
      # Schritt sammelt alle definierten Symbole des Bundles ein und haelt
      # jede offene Anforderung dagegen, die auf ein Framework AUS DIESEM
      # BUNDLE zeigt (erkennbar am Swift-Modulnamen im Symbol). Fremde
      # Symbole aus dem System bleiben aussen vor.
      - name: Frameworks gegeneinander pruefen
        working-directory: mobile/ios
        run: |
          APP="build/Build/Products/Release-iphoneos/mobile.app"
          FW="$APP/Frameworks"
          DEF="$(mktemp)"

          for f in "$FW"/*.framework; do
            n="$(basename "$f" .framework)"
            if [ -f "$f/$n" ]; then
              nm -j --defined-only "$f/$n" 2>/dev/null >> "$DEF" || true
            fi
          done
          nm -j --defined-only "$APP/mobile" 2>/dev/null >> "$DEF" || true
          sort -u -o "$DEF" "$DEF"
          echo "Definierte Symbole im Bundle: $(wc -l < "$DEF")"

          # Swift codiert den Modulnamen laengenpraefigiert: ExpoFont -> 8ExpoFont
          PAT=""
          for f in "$FW"/*.framework; do
            n="$(basename "$f" .framework)"
            PAT="$PAT${#n}$n|"
          done
          PAT="${PAT%|}"

          FEHLER=0
          for f in "$FW"/*.framework; do
            n="$(basename "$f" .framework)"
            [ -f "$f/$n" ] || continue
            for s in $(nm -j -u "$f/$n" 2>/dev/null | grep -E '^_\$s('"$PAT"')' || true); do
              if ! grep -qxF "$s" "$DEF"; then
                echo "  FEHLT: $s"
                echo "         angefordert von $n, von keinem Framework geliefert"
                FEHLER=1
              fi
            done
          done

          if [ "$FEHLER" -ne 0 ]; then
            echo "::error::Frameworks im Bundle passen nicht zusammen - die App wuerde beim Start abstuerzen (dyld), noch vor der ersten Zeile JS."
            exit 1
          fi
          echo "Alle framework-uebergreifenden Symbole sind aufloesbar."

      - uses: actions/upload-artifact@v4
        with:
          name: mobile-unsigned-ipa
          path: mobile/ios/mobile-unsigned.ipa
          retention-days: 14
